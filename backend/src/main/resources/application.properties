server.port=8080
spring.application.name=bookmark-lms

# Database Configuration (Embedded H2 with MySQL compatibility - zero configuration required)
spring.datasource.url=jdbc:h2:file:./data/bookmark_lms;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# To switch back to local MySQL server when ready, uncomment below and comment above:
# spring.datasource.url=jdbc:mysql://localhost:3306/bookmark_lms?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=your_mysql_password
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
app.jwt.secret=Bookmark_LMS_Secret_Key_2024_SuperSecure_256bit_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
app.jwt.expiration-ms=86400000

# CORS
app.cors.allowed-origins=http://localhost:5173

# Fine rate (per day)
app.fine.rate-per-day=10.00

# Borrow limit
app.borrow.limit=5

# Borrow period (days)
app.borrow.period-days=14

# Logging
logging.level.com.bookmark=INFO
